replicaCount: 3

image:
  repository: cloud-native-task-api
  tag: "1.0"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 80
  targetPort: 8000

app:
  name: Cloud Native Task API
  environment: development
  logLevel: info

secret:
  dbPassword: "demo-password-123"

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi
