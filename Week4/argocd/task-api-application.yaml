apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: task-api
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/armanlohtia/ICP-427D20C3-2026-REPO.git
    targetRevision: main
    path: Week3/helm/task-api

    helm:
      releaseName: task-api

  destination:
    server: https://kubernetes.default.svc
    namespace: devops-week3

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
